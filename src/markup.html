<!-- ════════════════════════════════════════════════════════════
     endmid.gg — the empty containers our features live in

     Three of them: the Shorts player, the Twitch panel, and the games
     overlay. They start hidden and are filled in by app.js when you
     open the matching tab.

     (The Circle snippet injects this into <body> BEFORE loading
     app.js, so every section finds the elements it looks for. Styling
     is in styles.css — there is none in here.)
     ════════════════════════════════════════════════════════════ -->
<!-- SHORTS PLAYER — hidden until the Shorts tab is pressed -->
<div id="reels-wrapper" class="reels-wrapper" style="display: none;">
  <div class="reels-main">
    <div class="reels-player" id="reels-player">
      <div class="reels-top-left">
        <button class="reels-play-pill" id="reels-play-btn" title="Play/Pause" aria-label="Play or pause">
          <svg id="reels-play-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        </button>
        <div class="reels-volume-pill" id="reels-volume-btn" title="Toggle mute" aria-label="Toggle mute">
          <div class="reels-volume-pill-icon">
            <svg id="reels-volume-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
          </div>
          <input type="range" class="reels-volume-pill-slider" id="reels-volume-slider" min="0" max="100" value="40" step="1">
        </div>
      </div>
      <!-- Attribution. The iframe is pointer-events: none, so YouTube's own
           watermark link is unreachable; these restore the route back. Sits
           above the scroll track so its clicks do not open the video.
           No loading="lazy" on either avatar here or in the rail: this markup
           is injected while #reels-wrapper is display:none, and a lazy image
           inside a hidden container is never scheduled — it stays at
           naturalWidth 0 even after the container is shown. -->
      <div class="reels-attribution" id="reels-attribution">
        <a class="reels-attr-channel" id="reels-attr-channel" href="#" target="_blank" rel="noopener noreferrer">
          <img class="reels-attr-avatar" id="reels-attr-avatar" alt="">
          <span class="reels-attr-handle" id="reels-attr-handle"></span>
        </a>
        <a class="reels-attr-yt" id="reels-attr-yt" href="#" target="_blank" rel="noopener noreferrer" aria-label="Watch this video on YouTube">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M21.6 7.2s-.2-1.5-.9-2.1c-.8-.9-1.7-.9-2.1-1C15.9 3.8 12 3.8 12 3.8s-3.9 0-6.6.3c-.4.1-1.3.1-2.1 1-.6.6-.9 2.1-.9 2.1S2.2 9 2.2 10.8v1.7c0 1.8.2 3.6.2 3.6s.2 1.5.9 2.1c.8.9 1.9.9 2.4 1 1.7.2 6.3.3 6.3.3s3.9 0 6.6-.3c.4-.1 1.3-.1 2.1-1 .6-.6.9-2.1.9-2.1s.2-1.8.2-3.6v-1.7c0-1.8-.2-3.6-.2-3.6zM9.8 14.9V8.7l5.6 3.1-5.6 3.1z"/></svg>
          <span>YouTube</span>
        </a>
      </div>
    </div>
    <div class="reels-sidebar">
      <div class="reels-engagement-item">
        <span class="reels-icon-circle"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3H14z"/><path d="M7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/></svg></span>
        <span class="reels-engagement-count" id="reels-likes-count">—</span>
      </div>
      <button class="reels-engagement-item" id="reels-comments-btn" type="button" aria-label="Show comments" aria-expanded="false" aria-controls="reels-comments-panel">
        <span class="reels-icon-circle"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></span>
        <span class="reels-engagement-count" id="reels-comments-count">—</span>
      </button>
      <button class="reels-engagement-item" id="reels-share-btn" type="button" aria-label="Share this video">
        <span class="reels-icon-circle"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg></span>
        <span class="reels-engagement-count" id="reels-share-label">Share</span>
      </button>
      <!-- Bottom of the rail, matching Shorts. The column is justify-content:
           flex-end, so adding this pushes the three above it upward on its
           own — no offsets to retune. -->
      <a class="reels-engagement-item reels-channel-item" id="reels-channel-link" href="#" target="_blank" rel="noopener noreferrer" aria-label="Open this channel on YouTube">
        <img class="reels-channel-avatar" id="reels-channel-avatar" alt="">
      </a>
    </div>
    <!-- Height comes from the flex row, so it tracks the player at every
         viewport size without JavaScript measuring anything. -->
    <aside class="reels-comments" id="reels-comments-panel" aria-hidden="true" aria-label="Comments">
      <div class="reels-comments-head">
        <span class="reels-comments-title">Comments</span>
        <span class="reels-comments-total" id="reels-comments-total"></span>
        <button class="reels-comments-close" id="reels-comments-close" type="button" aria-label="Close comments">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="reels-comments-body" id="reels-comments-body"></div>
    </aside>
  </div>
  <div class="reels-nav-arrows">
    <div class="reels-nav-arrow" id="reels-nav-up" title="Previous video (↑)" role="button" tabindex="0" aria-label="Previous video"><svg viewBox="0 0 24 24"><polyline points="18 15 12 9 6 15"/></svg></div>
    <div class="reels-nav-arrow" id="reels-nav-down" title="Next video (↓)" role="button" tabindex="0" aria-label="Next video"><svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg></div>
  </div>
</div>

<!-- Twitch player HTML (hidden until Twitch tab is pressed) -->
<div id="twitch-container" style="display: none;">
  <div id="video-wrapper"></div>
  <div id="chat-wrapper"></div>
  <div id="control-bar">
    <button id="toggle-chat-button" class="control-button" style="width: 90px;">Show Chat</button>
    <div style="margin-left: 15px; color: white; font-weight: bold;">Live Streamers:</div>
    <div id="stream-buttons"></div>
    <div id="twitch-pagination" style="display: flex; gap: 6px; margin-left: auto; margin-right: 10px;">
      <button id="prev-button" class="pagination-arrow" disabled>‹</button>
      <button id="next-button" class="pagination-arrow" disabled>›</button>
    </div>
  </div>
</div>

<!-- Mini games HTML (hidden until Games tab is pressed) -->
<div id="games-container" style="display: none;">
  <div id="games-menu">
    <div class="games-menu-title">Mini Games</div>
    <button class="games-menu-btn games-active" data-game="wheel">🎡 Hero Wheel</button>
    <button class="games-menu-btn" data-game="slark">🦈 Slarky Run</button>
  </div>
  <div id="games-stage">
    <div id="wheel-area">
      <div id="wheel-pointer"></div>
      <canvas id="wheel-canvas" width="640" height="640"></canvas>
      <button id="wheel-spin-btn">SPIN</button>
    </div>
    <div id="slark-area">
      <canvas id="slark-canvas" width="900" height="320"></canvas>
      <div class="slark-hint">Space / ↑ / click to jump &nbsp;•&nbsp; hold ↓ to duck</div>
    </div>
    <div id="wheel-winner" class="games-popup">
      <div class="games-popup-card">
        <div class="games-popup-label">Winner</div>
        <div class="games-popup-name" id="wheel-winner-name"></div>
        <button class="games-popup-close" id="wheel-winner-close">Spin Again</button>
      </div>
    </div>
    <div id="slark-death" class="games-popup">
      <div class="games-popup-card death">
        <div class="games-popup-label">You Died</div>
        <div class="games-popup-name" id="slark-death-score"></div>
        <div class="games-popup-sub" id="slark-death-best"></div>
        <div class="games-popup-highscore" id="slark-death-record">🏆 NEW HIGH SCORE!</div>
        <button class="games-popup-close" id="slark-death-close">Play Again</button>
      </div>
    </div>
  </div>
</div>
